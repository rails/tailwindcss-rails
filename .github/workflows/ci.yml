name: CI
concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    types: [opened, synchronize]
    branches:
      - '*'

permissions: {}

jobs:
  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm Gemfile.lock
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # zizmor: ignore[cache-poisoning] -- cached deps are for testing, not release artifact generation # v1.320.0
        with:
          ruby-version: ${{matrix.ruby}}
          bundler: latest
          bundler-cache: true
      - name: Run tests
        run: bin/test

  user-install:
    strategy:
      fail-fast: false
      matrix:
        plat: [ "ubuntu", "macos" ]
    runs-on: ${{matrix.plat}}-latest
    permissions:
      contents: read
    env:
      GEM_HOME: ${{ github.workspace }}/.gem # Needs to be a writable directory to bundle remove/add
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "4.0"
          bundler: latest
      - run: test/integration/user_install_test.sh
        shell: bash

  user-upgrade:
    strategy:
      fail-fast: false
      matrix:
        plat: [ "ubuntu", "macos" ]
    runs-on: ${{matrix.plat}}-latest
    permissions:
      contents: read
    env:
      GEM_HOME: ${{ github.workspace }}/.gem # Needs to be a writable directory to bundle remove/add
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "4.0"
          bundler: latest
      - run: test/integration/user_upgrade_test.sh
        shell: bash
